<div class="home-page">

    <!-- =========================================
         إشعار دخول الأشخاص
    ========================================== -->

    <div
        class="live-event-card"
        id="live-event-card"
    >

        <div class="event-label">

            <span class="event-dot"></span>

            <span>
                نورت اللايف ✨
            </span>

        </div>


        <div class="profile-wrapper">

            <div class="profile-glow"></div>

            <img
                id="member-profile"
                class="member-profile"
                src=""
                alt="Profile"
                referrerpolicy="no-referrer"
            >

        </div>


        <div class="member-info">

            <div
                id="member-name"
                class="member-name"
            >
                بانتظار دخول شخص...
            </div>

            <div
                id="member-username"
                class="member-username"
            >
                سيتم عرض أول شخص يدخل اللايف
            </div>

        </div>

    </div>


    <!-- =========================================
         مركز أحداث اللايف

         هنا ستظهر:
         🎁 الدعم
         ❤️ التكبيس
         💬 التعليقات
         ➕ المتابعة
         🔔 الاشتراك
         🔄 المشاركة
    ========================================== -->

    <div
        class="live-events-center"
        id="live-events-center"
        aria-live="polite"
        aria-hidden="true"
    >

        <!-- نوع الحدث -->

        <div
            class="live-event-type"
            id="live-event-type"
        ></div>


        <!-- صورة الشخص -->

        <div
            class="live-event-avatar-wrapper"
            id="live-event-avatar-wrapper"
        >

            <div
                class="live-event-avatar-glow"
                id="live-event-avatar-glow"
            ></div>

            <img
                id="live-event-avatar"
                class="live-event-avatar"
                src=""
                alt="Profile"
                referrerpolicy="no-referrer"
            >

        </div>


        <!-- اسم الشخص -->

        <div
            class="live-event-user"
            id="live-event-user"
        ></div>


        <!-- اسم الهدية / نص التعليق / وصف الحدث -->

        <div
            class="live-event-content"
            id="live-event-content"
        ></div>


        <!-- قيمة الدعم أو عدد التكبيسات -->

        <div
            class="live-event-value"
            id="live-event-value"
        ></div>

    </div>

</div>
