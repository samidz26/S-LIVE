<div class="home-page">

    <!-- =========================================
         حساب صاحب اللايف
    ========================================== -->

    <div class="live-account" id="live-account">

        <button
            class="live-account-button"
            id="live-account-button"
            type="button"
            aria-expanded="false"
        >

            <div class="live-avatar-wrapper">

                <img
                    id="live-profile-image"
                    class="live-profile-image"
                    src=""
                    alt="TikTok"
                    referrerpolicy="no-referrer"
                >

                <span
                    class="live-status-dot"
                    title="متصل"
                ></span>

            </div>


            <div class="live-account-info">

                <span
                    id="live-username"
                    class="live-username"
                >
                    @username
                </span>

                <span class="live-status-text">
                    LIVE
                </span>

            </div>


            <span
                class="live-arrow"
                aria-hidden="true"
            >
                ▾
            </span>

        </button>


        <!-- =========================================
     قائمة الحساب
========================================== -->

<div
    class="live-dropdown"
    id="live-dropdown"
    aria-hidden="true"
>

    <!-- Home -->

    <button
        class="dropdown-icon-button"
        id="home-button"
        type="button"
        aria-label="Home"
        title="Home"
    >
        🏠
    </button>


    <!-- الألعاب -->

    <button
        class="dropdown-icon-button"
        id="games-button"
        type="button"
        aria-label="Games"
        title="Games"
    >
        🎮
    </button>


    <!-- الإعدادات -->

    <button
        class="dropdown-icon-button"
        id="settings-button"
        type="button"
        aria-label="Settings"
        title="Settings"
    >
        ⚙️
    </button>


    <!-- قطع الاتصال -->

    <button
        class="dropdown-icon-button disconnect-button"
        id="disconnect-button"
        type="button"
        aria-label="Disconnect"
        title="Disconnect"
    >
        ❌
    </button>

</div>

    </div>


    <!-- =========================================
         إشعار دخول الأشخاص
    ========================================== -->

    <div
        class="live-event-card"
        id="live-event-card"
    >

        <div class="event-label">

            <span class="event-dot"></span>

            <span>
                نورت اللايف ✨
            </span>

        </div>


        <div class="profile-wrapper">

            <div class="profile-glow"></div>

            <img
                id="member-profile"
                class="member-profile"
                src=""
                alt="Profile"
                referrerpolicy="no-referrer"
            >

        </div>


        <div class="member-info">

            <div
                id="member-name"
                class="member-name"
            >
                بانتظار دخول شخص...
            </div>

            <div
                id="member-username"
                class="member-username"
            >
                سيتم عرض أول شخص يدخل اللايف
            </div>

        </div>

    </div>


    <!-- =========================================
         مركز أحداث اللايف
         
         هنا ستظهر لاحقاً:
         🎁 الدعم
         ❤️ التكبيس
         💬 التعليقات
         ➕ المتابعة
         🔔 الاشتراك
         🔄 المشاركة
    ========================================== -->

    <div
        class="live-events-center"
        id="live-events-center"
        aria-live="polite"
        aria-hidden="true"
    >

        <!--
            نوع الحدث
            مثال:
            دعم جديد
            تعليق جديد
            متابع جديد
            اشتراك جديد
        -->

        <div
            class="live-event-type"
            id="live-event-type"
        ></div>


        <!-- صورة الشخص -->

        <div
            class="live-event-avatar-wrapper"
            id="live-event-avatar-wrapper"
        >

            <div
                class="live-event-avatar-glow"
                id="live-event-avatar-glow"
            ></div>

            <img
                id="live-event-avatar"
                class="live-event-avatar"
                src=""
                alt="Profile"
                referrerpolicy="no-referrer"
            >

        </div>


        <!-- اسم الشخص -->

        <div
            class="live-event-user"
            id="live-event-user"
        ></div>


        <!-- اسم الهدية / نص التعليق / وصف الحدث -->

        <div
            class="live-event-content"
            id="live-event-content"
        ></div>


        <!-- قيمة الدعم أو عدد التكبيسات -->

        <div
            class="live-event-value"
            id="live-event-value"
        ></div>

    </div>

</div>
