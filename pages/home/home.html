<div class="home-page">

    <!-- حساب صاحب اللايف -->
    <div class="live-account" id="live-account">

        <button
            class="live-account-button"
            id="live-account-button"
            type="button"
            aria-expanded="false"
        >

            <div class="live-avatar-wrapper">

                <img
                    id="live-profile-image"
                    class="live-profile-image"
                    src=""
                    alt="TikTok"
                    referrerpolicy="no-referrer"
                >

                <span
                    class="live-status-dot"
                    title="متصل"
                ></span>

            </div>

            <div class="live-account-info">

                <span
                    id="live-username"
                    class="live-username"
                >
                    @username
                </span>

                <span class="live-status-text">
                    LIVE
                </span>

            </div>

            <span
                class="live-arrow"
                aria-hidden="true"
            >
                ▾
            </span>

        </button>


        <!-- قائمة الحساب -->
        <div
            class="live-dropdown"
            id="live-dropdown"
            aria-hidden="true"
        >

            <div class="dropdown-account">

                <span class="dropdown-live-dot"></span>

                <span>
                    متصل باللايف
                </span>

            </div>

            <button
                class="disconnect-button"
                id="disconnect-button"
                type="button"
            >

                <span class="disconnect-icon">
                    ⏻
                </span>

                <span>
                    قطع الاتصال
                </span>

            </button>

        </div>

    </div>


    <!-- إشعار دخول الأشخاص -->
    <div
        class="live-event-card"
        id="live-event-card"
    >

        <div class="event-label">

            <span class="event-dot"></span>

            <span>
                دخل إلى اللايف
            </span>

        </div>


        <div class="profile-wrapper">

            <div class="profile-glow"></div>

            <img
                id="member-profile"
                class="member-profile"
                src=""
                alt="Profile"
                referrerpolicy="no-referrer"
            >

        </div>


        <div class="member-info">

            <div
                id="member-name"
                class="member-name"
            >
                بانتظار دخول شخص...
            </div>

            <div
                id="member-username"
                class="member-username"
            >
                سيتم عرض أول شخص يدخل اللايف
            </div>

        </div>

    </div>

</div>
