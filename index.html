<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>S-LIVE</title>

    <link
        rel="stylesheet"
        href="css/frame.css"
    >

</head>

<body>

    <div class="phone-frame">

        <div class="top-section"></div>

        <div
            class="middle-section"
            id="app-screen"
        >

            <!-- الحساب الثابت -->
            <div
                class="s-live-fixed-account"
                id="s-live-fixed-account"
            >

                <div
                    class="live-account"
                    id="live-account"
                >

                    <button
                        class="live-account-button"
                        id="live-account-button"
                        type="button"
                        aria-expanded="false"
                    >

                        <div class="live-avatar-wrapper">

                            <img
                                id="live-profile-image"
                                class="live-profile-image"
                                src=""
                                alt="TikTok"
                                referrerpolicy="no-referrer"
                            >

                            <span
                                class="live-status-dot"
                                title="متصل"
                            ></span>

                        </div>

                        <div class="live-account-info">

                            <span
                                id="live-username"
                                class="live-username"
                            >
                                @username
                            </span>

                            <span class="live-status-text">
                                LIVE
                            </span>

                        </div>

                        <span
                            class="live-arrow"
                            aria-hidden="true"
                        >
                            ▾
                        </span>

                    </button>


                    <!-- قائمة التنقل -->
                    <div
                        class="live-dropdown"
                        id="live-dropdown"
                        aria-hidden="true"
                    >

                        <button
                            class="dropdown-icon-button"
                            id="home-button"
                            type="button"
                            aria-label="Home"
                            title="Home"
                        >
                            🏠
                        </button>

                        <button
                            class="dropdown-icon-button"
                            id="games-button"
                            type="button"
                            aria-label="Games"
                            title="Games"
                        >
                            🎮
                        </button>

                        <button
                            class="dropdown-icon-button"
                            id="settings-button"
                            type="button"
                            aria-label="Settings"
                            title="Settings"
                        >
                            ⚙️
                        </button>

                        <button
                            class="dropdown-icon-button disconnect-button"
                            id="disconnect-button"
                            type="button"
                            aria-label="Disconnect"
                            title="Disconnect"
                        >
                            ❌
                        </button>

                    </div>

                </div>

            </div>


            <!-- حاوية الصفحات -->
            <div
                id="s-live-page-container"
                class="s-live-page-container"
            ></div>

        </div>

        <div class="bottom-section"></div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
